enabled = true

# Documentation only — the engine never reads this table (ADR 0012). It records what onboarding
# concluded about the repository, and why the policy below looks the way it does.
[risk]
# Releases reach consumers only through a human-merged release PR; the engine ignores those
# (their author is not an allowlisted bot).
release_mode      = "release-please"
deploys_from_main = false
# Unit tests cover the engine, which is stdlib-only; the `action` job runs action.yml end to end.
# release-please-action is not exercised, but a broken bump only stalls releases, visibly.
test_confidence   = "high"
criticality       = "normal"

[policy]
patch    = "merge"
minor    = "merge"
major    = "escalate"
digest   = "merge"
pin      = "merge"

# Action majors only touch CI, and the `action` job runs every workflow change before merge,
# so a breaking action shows up as a red check rather than a broken release.
[policy.github-actions]
major = "merge"

[limits]
max_merges    = 10
max_repairs   = 3
attempt_cap   = 2
lease_minutes = 30

[repair]
strategy = "bot-branch"
