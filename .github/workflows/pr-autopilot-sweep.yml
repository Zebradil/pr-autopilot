name: pr-autopilot sweep

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show verdicts without acting
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: pr-autopilot-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-slim
    steps:
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: sts
        with:
          domain: sts.zebradil.dev
          scope: ${{ github.repository_owner }}
          identity: pr-autopilot
      # Runs the checked-out action so this repo dogfoods main before a release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./
        with:
          dry-run: ${{ inputs.dry_run }}
          token: ${{ steps.sts.outputs.token }}
