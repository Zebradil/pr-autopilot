name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  action:
    # Runs action.yml end to end, so a broken bump of an action it uses fails here instead of in
    # every governed repository after the next release. Secrets are unavailable to fork PRs.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./
        with:
          dry-run: 'true'
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
