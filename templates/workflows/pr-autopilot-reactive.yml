# Reacts to a bot opening or updating a pull request. Same engine, one PR number.
name: pr-autopilot reactive

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-autopilot-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  triage:
    # Checks are usually still running at this point; the engine will say "wait" and the
    # scheduled sweep picks it up. Reacting here is what makes a green PR merge within minutes.
    if: endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Mint a GitHub App installation token
        # Set the PR_AUTOPILOT_APP_ID repository variable to use a GitHub App (the documented
        # identity — see docs/manual.md, "Identity"). Leave it unset to fall back to the
        # PR_AUTOPILOT_TOKEN secret. The App needs contents: write and pull-requests: write.
        id: app-token
        if: vars.PR_AUTOPILOT_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PR_AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.PR_AUTOPILOT_APP_PRIVATE_KEY }}
      - name: Fetch the engine
        run: |
          curl -fsSL -o pr_autopilot.py \
            https://raw.githubusercontent.com/Zebradil/pr-autopilot/v1/pr_autopilot.py
      - name: Triage this pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.PR_AUTOPILOT_TOKEN }}
        run: |
          python3 pr_autopilot.py sweep ${{ github.event.pull_request.number }} \
            --repo "$GITHUB_REPOSITORY" || true
