# Reacts to a bot opening or updating a pull request. Same engine, one PR number.
name: pr-autopilot reactive

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-autopilot-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  triage:
    # Checks are usually still running at this point; the engine will say "wait" and the
    # scheduled sweep picks it up. Reacting here is what makes a green PR merge within minutes.
    if: endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-slim
    steps:
      - uses: Zebradil/pr-autopilot@v1.1.0 # x-release-please-version
        with:
          pull-request: ${{ github.event.pull_request.number }}
          # Set the PR_AUTOPILOT_CLIENT_ID variable to act as a GitHub App (the documented identity), or leave it
          # unset to fall back to the PR_AUTOPILOT_TOKEN secret. See docs/manual.md, "Identity".
          client-id: ${{ vars.PR_AUTOPILOT_CLIENT_ID }}
          app-private-key: ${{ secrets.PR_AUTOPILOT_APP_PRIVATE_KEY }}
          token: ${{ secrets.PR_AUTOPILOT_TOKEN }}
